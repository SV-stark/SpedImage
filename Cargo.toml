[package]
name = "spedimage"
version = "0.11.0"
edition = "2024"
description = "Ultra-Lightweight GPU-Accelerated Image Viewer"
authors = ["SpedImage Team"]
license = "MIT"
rust-version = "1.94.0"

[features]
default = ["clipboard-image"]
# Clipboard image support on platforms without a hand-written clipboard
# implementation. Windows always has it: `src/app/clipboard.rs` writes CF_DIB
# itself, so the Windows build never needs this and never pulls in `image`.
clipboard-image = ["arboard/image-data"]

[dependencies]
# Performance and Features Integrations
fast_image_resize = "6.0"
jxl-oxide = "0.11"
memmap2 = "0.9"
qcms = "0.3"

# UI and Windowing
winit = { version = "0.30", features = ["rwh_06"] }
egui = "0.34"
# Default features are off on purpose: `clipboard` pulls `arboard/image-data`,
# i.e. the whole `image` crate (a fourth PNG decoder plus, on macOS, a second
# TIFF crate) purely so egui can reach the OS clipboard. The app talks to the
# clipboard itself in `src/app/clipboard.rs`, so egui's copy/paste plumbing is
# never used.
egui-winit = { version = "0.34", default-features = false, features = [
    "links",
    "bytemuck",
    "wayland",
    "x11",
] }
egui-wgpu = "0.34"
# Only the codecs the generic fallback path can reach: every format with a
# specialised loader (gif/jpeg/svg/jxl/qoi/exr/heic/tiff/raw/webp/ico) is claimed
# before `Image::read` is called.
#
# psd/ppm/hdr are cheap here because each is a self-contained pure-Rust
# `zune-*` crate with no transitive weight (11-15 KB of source each) and
# `guess_format` sniffs all three by magic bytes (codecs.rs:740-763), so the
# generic path in `loader.rs` decodes them with no new dispatch code.
#
# Still deliberately OFF, because each one costs a duplicate, a C dependency, or
# is outright broken:
#   qoi       — a second decoder for the `qoi` crate we already depend on
#   farbfeld  — zune-farbfeld 0.5.2's `decode()` cannot succeed for any file
#               (see `load_farbfeld`); the format is decoded by hand instead
#   jpeg-xl   — a second jxl-oxide (0.12) alongside the one we decode with
#   jpeg      — pulls the `jpeg-encoder` *encoder* plus a zune-jpeg copy
#   webp      — see below
#
# `webp` is NOT enabled: zune-image 0.5.0's WebP codec has an ungated
# `use jxl_oxide::...` (src/codecs/webp.rs:6), so the feature only compiles
# alongside `jpeg-xl`. WebP is decoded by `image-webp` directly instead, which
# is the same crate that codec wraps.
zune-image = { version = "=0.5.0", default-features = false, features = [
    "png",
    "bmp",
    "psd",
    "ppm",
    "hdr",
    "simd",
] }
image-webp = "0.2"
zune-core = "=0.5.1"
tiff = "0.9"
# 0.14, not 0.13: resvg already pulls gif 0.14.2, so pinning the older line
# compiled two copies of the same decoder (2.1 MB + 3.3 MB of debug rlib).
# The API we use — DecodeOptions::set_color_output, ColorOutput::RGBA,
# DisposalMethod, Encoder, Frame::from_rgba_speed — is unchanged in 0.14.
gif = "0.14"
resvg = "0.47"
pollster = "0.3"
color-eyre = "0.6"
thiserror = "2.0"
tracing = { version = "0.1", features = ["release_max_level_info"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rayon = "1.10"
dirs = "5.0"
notify-debouncer-full = "0.3"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The lib is named `exif`, which is how `src/image/metadata.rs` reaches it.
# This must stay an explicit dependency: zune-image's `metadata` feature pulls a
# second (0.6.x) copy, and that feature is intentionally off above.
kamadak-exif = "0.5"

# GPU Rendering
wgpu = "29.0"
bytemuck = { version = "1.19", features = ["derive"] }

# Concurrency
crossbeam-channel = "0.5"
wallpaper = "3.2"
moka = { version = "0.12", features = ["sync"] }
# Was a git-pinned AGPL-3.0 build (rav1d/ultrahdr-core/archmage/magetypes/whereat).
# heic-rs is MIT OR Apache-2.0, has no dependencies beyond optional rayon, and
# is a pinned crates.io release. It decodes HEIC/HEIF only — AVIF needs AV1.
heic-rs = "0.1.1"
rawloader = "0.37.1"
trash = "5.2"
webbrowser = "1.2"

# Lightweight Utilities & Performance Extensions
qoi = "0.4"
glam = "0.29"
rustc-hash = "2.1"
single-instance = "0.3"

# Pure Rust Image Formats & Color Science
exr = "1.7"
palette = "0.7"
fast-srgb8 = "1.0"
img-parts = "0.3"
libjpeg-turbo-rs = "0.8.0"

[target.'cfg(not(windows))'.dependencies]
# Windows uses the hand-written CF_DIB / CF_UNICODETEXT / CF_HDROP paths in
# `src/app/clipboard.rs` instead, so it never links arboard at all. Keeping
# `default-features = false` here stops `image-data` (and therefore the `image`
# crate) from coming along on Linux/macOS unless `clipboard-image` asks for it.
arboard = { version = "3.4", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    # GetICMProfileW: the monitor's ICC profile for display colour matching.
    "Win32_UI_ColorSystem",
] }

[dev-dependencies]
crossbeam-channel = "0.5"
divan = "0.1"
gif = "0.14"
libjpeg-turbo-rs = "0.8.0"
# `make_png` in tests/loader_tests.rs synthesises a fixture through zune-image's
# own encoder. This is the same crate the lib already depends on, so the test
# target does not gain a new codec, but it must be named explicitly to be
# reachable from an integration test.
zune-image = { version = "=0.5.0", default-features = false, features = [
    "png",
    "simd",
] }
zune-core = "=0.5.1"

[lib]
name = "spedimage_lib"
path = "src/lib.rs"

[[bin]]
name = "spedimage"
path = "src/main.rs"

[[bench]]
name = "image_processing"
harness = false

[workspace.metadata.dist]
cargo-dist-version = "0.13.0"
ci = "github"
installers = ["shell", "powershell"]
targets = ["x86_64-pc-windows-msvc"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dist]
inherits = "release"
lto = "thin"

[profile.dev.package."*"]
opt-level = 3
